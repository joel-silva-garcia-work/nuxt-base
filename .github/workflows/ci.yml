name: CI

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and unit tests
    runs-on: ubuntu-latest
    container:
      image: node:22.23.4-bookworm-slim
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: |
          if [ -f scripts/tsconfig.json ]; then
            npm run typecheck
          else
            npm exec -- nuxt typecheck
            echo "::notice::scripts/tsconfig.json is not present; checked the Nuxt application only."
          fi

      - name: Unit tests
        run: |
          if [ -n "$(find tests/unit -type f -name '*.test.ts' -print -quit 2>/dev/null)" ]; then
            npm run test:unit
          else
            echo "::notice::No unit test files exist yet; this suite will run automatically when added."
          fi

      - name: Build
        run: npm run build

  integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    container:
      image: node:22.23.4-bookworm-slim
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-admin-password
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci-only-admin-password
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: nuxt_base
      DB_USER: nuxt_base_app
      DB_PASSWORD: ci-only-runtime-password
      DB_SSL: disable
      TEST_DB_HOST: postgres
      TEST_DB_PORT: "5432"
      TEST_DB_NAME: nuxt_base_test
      TEST_DB_USER: nuxt_base_test_app
      TEST_DB_PASSWORD: ci-only-test-password
      TEST_DB_SSL: disable
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install dependencies
        run: npm ci

      - name: Install PostgreSQL client
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends postgresql-client

      - name: Provision isolated development and test databases
        env:
          PGPASSWORD: ${{ env.POSTGRES_PASSWORD }}
        run: psql --host postgres --username "$POSTGRES_USER" --dbname postgres --file scripts/sql/provision.sql

      - name: Check database connections
        run: npm run db:check

      - name: PostgreSQL integration tests
        run: npm run test:integration

  docker-validation:
    name: Docker and Compose validation
    runs-on: ubuntu-latest
    env:
      POSTGRES_ADMIN_PASSWORD: ci-only-admin-password
      DB_PASSWORD: ci-only-runtime-password
      TEST_DB_PASSWORD: ci-only-test-password
      DB_NAME: nuxt_base
      DB_USER: nuxt_base_app
      TEST_DB_NAME: nuxt_base_test
      TEST_DB_USER: nuxt_base_test_app
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Build production image
        run: docker build --tag nuxt-base:ci .

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet

      - name: Ensure PostgreSQL port is loopback-only by default
        run: |
          docker compose --env-file .env.example config --format json |
            python3 -c 'import json, sys; ports = json.load(sys.stdin)["services"]["postgres"]["ports"]; assert any(port["target"] == 5432 and port["host_ip"] == "127.0.0.1" for port in ports)'

      - name: Start Compose app and wait for health
        run: docker compose --env-file .env.example up --build --detach --wait --wait-timeout 180

      - name: Provision Compose databases
        run: >-
          docker compose --env-file .env.example exec --no-TTY postgres
          sh -ec 'PGPASSWORD="$POSTGRES_PASSWORD" exec psql -h 127.0.0.1
          -U "$POSTGRES_USER" -d postgres -f /provision/provision.sql'

      - name: Check development and test connections from app container
        run: docker compose --env-file .env.example exec --no-TTY app npm run db:check

      - name: Run integration tests from testing container
        run: docker compose --env-file .env.example --profile testing run --build --rm tests npm run test:integration

      - name: Smoke test app in container
        run: >-
          docker compose --env-file .env.example exec --no-TTY app
          node -e "fetch('http://127.0.0.1:3000').then(async (response) => {
          const body = await response.text();
          if (!response.ok || !body.includes('Nuxt Base')) throw new Error('Unexpected app response');
          }).catch((error) => { console.error(error); process.exit(1); })"

      - name: Stop Compose app
        if: always()
        run: docker compose --env-file .env.example down --volumes
