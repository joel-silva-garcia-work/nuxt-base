name: nuxt-base

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      POSTGRES_DB: postgres
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      TEST_DB_USER: ${TEST_DB_USER:?Set TEST_DB_USER in .env}
      TEST_DB_PASSWORD: ${TEST_DB_PASSWORD:?Set TEST_DB_PASSWORD in .env}
      TEST_DB_NAME: ${TEST_DB_NAME:?Set TEST_DB_NAME in .env}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/sql:/provision:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d postgres
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    build:
      context: .
      target: development
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NUXT_HOST: 0.0.0.0
      NUXT_PORT: "3000"
      NUXT_TELEMETRY_DISABLED: "1"
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_SSL: ${DB_SSL:-disable}
      TEST_DB_HOST: ${TEST_DB_HOST:-postgres}
      TEST_DB_PORT: ${TEST_DB_PORT:-5432}
      TEST_DB_NAME: ${TEST_DB_NAME:?Set TEST_DB_NAME in .env}
      TEST_DB_USER: ${TEST_DB_USER:?Set TEST_DB_USER in .env}
      TEST_DB_PASSWORD: ${TEST_DB_PASSWORD:?Set TEST_DB_PASSWORD in .env}
      TEST_DB_SSL: ${TEST_DB_SSL:-disable}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - nuxt_cache:/app/.nuxt
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  tests:
    profiles:
      - testing
    build:
      context: .
      target: development
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_SSL: ${DB_SSL:-disable}
      TEST_DB_HOST: ${TEST_DB_HOST:-postgres}
      TEST_DB_PORT: ${TEST_DB_PORT:-5432}
      TEST_DB_NAME: ${TEST_DB_NAME:?Set TEST_DB_NAME in .env}
      TEST_DB_USER: ${TEST_DB_USER:?Set TEST_DB_USER in .env}
      TEST_DB_PASSWORD: ${TEST_DB_PASSWORD:?Set TEST_DB_PASSWORD in .env}
      TEST_DB_SSL: ${TEST_DB_SSL:-disable}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - nuxt_cache:/app/.nuxt
    command:
      - sh
      - -ec
      - npm run db:check && npm run test:unit && npm run test:integration

volumes:
  node_modules:
  nuxt_cache:
  postgres_data:
