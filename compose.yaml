name: nuxt-base

services:
  app:
    build:
      context: .
      target: development
    init: true
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NUXT_HOST: 0.0.0.0
      NUXT_PORT: "3000"
      NUXT_TELEMETRY_DISABLED: "1"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - nuxt_cache:/app/.nuxt
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  node_modules:
  nuxt_cache:
